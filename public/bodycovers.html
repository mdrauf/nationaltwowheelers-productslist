<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTC-BODY COVERS</title>
</head>

<body>
    <h1>Body Covers List</h1>
    <img src="../image/bodycover.jpg" height="300" oncontextmenu="return false;" draggable="false" /> <br>
    <script>

        let allImages = document.querySelectorAll("img");
        allImages.forEach((value) => {
            value.oncontextmenu = (e) => {
                e.preventDefault();
            };
        });

    </script>
</body>

</html>
