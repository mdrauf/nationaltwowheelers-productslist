<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTC-HELMETS</title>
    <style>
        img {
            margin-left: 30px;
        }
    </style>
</head>

<body>
    <h1>Helmets List</h1>
    <br>
    <img src="../image/helmet.jpg" height="300" oncontextmenu="return false;" draggable="false" /> <br>
    <script>

        let allImages = document.querySelectorAll("img");
        allImages.forEach((value) => {
            value.oncontextmenu = (e) => {
                e.preventDefault();
            };
        });

    </script>
</body>

</html>
